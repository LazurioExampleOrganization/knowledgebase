name: Knowledgebase v2 runtime portability

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  runtime:
    name: Astro runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: app/v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test app runtime and v1 to v2 migration
        run: bun run test

      - name: Check knowledgebase
        run: bun run check

      - name: Build knowledgebase
        run: bun run build
